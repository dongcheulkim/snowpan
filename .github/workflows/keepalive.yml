# Render Free 슬립 방지 — 외부에서 주기적으로 헬스 핑.
# Free 인스턴스는 15분 무트래픽 시 슬립 → 다음 방문자가 콜드스타트 30초+ 를 겪음.
# 서버 내부 셀프핑(index.ts)은 슬립되면 같이 멈춰서 외부 핑이 필요.
# GitHub Actions cron 은 5분 간격 설정해도 혼잡 시 수 분 지연될 수 있어
# 한 번에 2회(0초·60초) 쳐서 공백을 줄임. Starter 승격 후엔 이 워크플로 삭제해도 됨.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping backend health
        run: |
          curl -sS -m 30 -o /dev/null -w "1st: %{http_code} %{time_total}s\n" https://snowpan.onrender.com/api/health || true
          sleep 60
          curl -sS -m 30 -o /dev/null -w "2nd: %{http_code} %{time_total}s\n" https://snowpan.onrender.com/api/health || true
