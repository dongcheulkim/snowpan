    <title>스노우판 — 스키·보드 중고거래·렌탈·레슨·숙소</title>
  </head>
  <body>
    <!-- 웹 첫 로딩 스플래시 — 워드마크 리빌. JS 로드 전에도 즉시 표시, React 마운트 후 main.tsx 가 제거. -->
    <div id="app-splash" aria-hidden="true">
      <div id="app-splash-logo-wrap">
        <img src="/snowpan-wordmark.svg" alt="" id="app-splash-logo-dim" />
        <img src="/snowpan-wordmark.svg" alt="" id="app-splash-logo" />
        <img src="/snowpan-wordmark.svg" alt="" id="app-splash-logo-hot" />
      </div>
    </div>
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000000;
        opacity: 1; transition: opacity .45s ease;
        overflow: hidden;
        /* 번들 로드 실패 시에도 스플래시가 영원히 남지 않게 — JS 없이 8초 후 자동 소멸. */
        animation: splashAutoHide .4s ease 8s forwards;
      }
      @keyframes splashAutoHide {
        to { opacity: 0; visibility: hidden; }
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      /* 로고 뒤 깊은 빛 웅덩이 — 검은 화면 중앙이 은은하게 밝음 */
      #app-splash::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 50% at 50% 47%,
          rgba(90, 150, 255, 0.20) 0%,
          rgba(60, 110, 220, 0.08) 45%,
          rgba(0, 0, 0, 0) 75%);
        animation: splashLight 1.1s ease-out both;
      }
      @keyframes splashLight {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      #app-splash-logo-wrap {
        position: relative;
        width: min(82vw, 380px);
        animation: splashLogo 1s cubic-bezier(.16, .84, .28, 1) both;
      }
      /* 미점등 상태 로고 — 꺼진 간판처럼 아주 희미하게 */
      #app-splash-logo-dim {
        position: absolute; inset: 0; width: 100%; height: auto;
        filter: brightness(0) invert(1);
        opacity: 0.13;
      }
      #app-splash-logo {
        position: relative;
        display: block; width: 100%; height: auto;
        filter: brightness(0) invert(1)
          drop-shadow(0 0 4px rgba(190, 225, 255, 0.35));
        /* 빛이 지나간 자리만 점등 — 소프트 마스크 좌→우 와이프 */
        -webkit-mask-image: linear-gradient(100deg, #000 45%, transparent 55%);
        -webkit-mask-size: 300% 100%;
        -webkit-mask-position: 80% 0;
        mask-image: linear-gradient(100deg, #000 45%, transparent 55%);
        mask-size: 300% 100%;
        mask-position: 80% 0;
        animation: splashReveal 1.15s linear .25s forwards;
      }
      @keyframes splashReveal {
        from { -webkit-mask-position: 80% 0; mask-position: 80% 0; }
        to   { -webkit-mask-position: 20% 0; mask-position: 20% 0; }
      }
      /* 리빌 앞머리 — 같은 로고를 강한 글로우로 겹치고 좁은 띠만 보이게 (순수 CSS 마스크) */
      #app-splash-logo-hot {
        position: absolute; inset: 0; width: 100%; height: auto;
        filter: brightness(0) invert(1)
          drop-shadow(0 0 5px rgba(255, 255, 255, 0.85));
        -webkit-mask-image: linear-gradient(100deg, transparent 42%, #000 48%, #000 52%, transparent 58%);
        -webkit-mask-size: 300% 100%;
        -webkit-mask-position: 80% 0;
        mask-image: linear-gradient(100deg, transparent 42%, #000 48%, #000 52%, transparent 58%);
        mask-size: 300% 100%;
        mask-position: 80% 0;
        animation: splashReveal 1.15s linear .25s both;
      }
      @keyframes splashLogo {
        0%   { opacity: 0; transform: scale(.9) translateY(8px); }
        55%  { opacity: 1; }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash-logo-wrap, #app-splash::before { animation: none; }
        #app-splash-logo { animation: none; -webkit-mask-image: none; mask-image: none; }
        #app-splash-logo-hot { display: none; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
