  <body>
    <!-- 웹 첫 로딩 스플래시 — 워드마크 리빌. JS 로드 전에도 즉시 표시, React 마운트 후 main.tsx 가 제거. -->
    <div id="app-splash" aria-hidden="true">
      <img src="/snowpan-wordmark.svg" alt="" id="app-splash-logo" />
    </div>
    <style>
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        opacity: 1; transition: opacity .45s ease;
        overflow: hidden;
        /* 번들 로드 실패 시에도 스플래시가 영원히 남지 않게 — JS 없이 8초 후 자동 소멸.
           정상 경로에선 main.tsx 가 1.5초쯤 제거하므로 이 폴백은 발동 안 함. */
        animation: splashAutoHide .4s ease 8s forwards;
      }
      @keyframes splashAutoHide {
        to { opacity: 0; visibility: hidden; }
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      /* 후레쉬 — 로고 뒤 중앙이 환하고 가장자리로 은은히 어두워지는 빛 웅덩이 */
      #app-splash::before {
        content: ''; position: absolute; inset: 0;
        background: radial-gradient(ellipse 95% 62% at 50% 47%,
          rgba(255, 255, 255, 0) 32%,
          rgba(15, 23, 42, 0.05) 62%,
          rgba(15, 23, 42, 0.14) 100%);
        animation: splashLight 1s ease-out both;
      }
      @keyframes splashLight {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      #app-splash-logo {
        position: relative;
        width: min(82vw, 380px); height: auto;
        filter: brightness(0); /* 순수 블랙 로고 */
        animation: splashLogo 1.1s cubic-bezier(.16, .84, .28, 1) both;
      }
      @keyframes splashLogo {
        0%   { opacity: 0; transform: scale(.9) translateY(8px); }
        55%  { opacity: 1; }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash-logo, #app-splash::before { animation: none; }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
