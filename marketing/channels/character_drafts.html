<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box} body{background:#0f172a;font-family:"Apple SD Gothic Neo",sans-serif;color:#fff;width:1600px;height:900px;display:flex;align-items:center;justify-content:space-around;padding:40px}
.card{width:480px;height:800px;background:linear-gradient(180deg,#1e293b,#0b1120);border-radius:40px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card svg{position:absolute;left:50%;top:170px;transform:translateX(-50%);width:400px;height:400px}
.name{position:absolute;top:50px;width:100%;text-align:center;font-size:30px;font-weight:900;letter-spacing:-1px}
.sub{position:absolute;top:96px;width:100%;text-align:center;font-size:18px;color:#BFE7FF;font-weight:600}
.bubble{position:absolute;left:40px;right:40px;bottom:120px;background:#fff;color:#0f172a;border-radius:28px;padding:22px 26px;font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.5px}
.bubble:after{content:"";position:absolute;top:-18px;left:50%;margin-left:-14px;border:14px solid transparent;border-bottom-color:#fff;border-top:0}
.logo{position:absolute;bottom:48px;width:100%;text-align:center}.logo img{height:26px;filter:invert(1) brightness(2)}
</style></head><body>
<!-- A: 스노판다 — 고글 쓴 판다 (스노우"판" 말장난) -->
<div class="card"><div class="name">A. 스노판다</div><div class="sub">스노우"판"의 판다 · 고글이 트레이드마크</div>
<svg viewBox="0 0 400 400"><defs><radialGradient id="g1" cx="40%" cy="35%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e5e7eb"/></radialGradient><linearGradient id="gog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
<ellipse cx="200" cy="380" rx="120" ry="14" fill="#000" opacity=".25"/>
<circle cx="118" cy="110" r="46" fill="#0f172a"/><circle cx="282" cy="110" r="46" fill="#0f172a"/>
<circle cx="200" cy="215" r="150" fill="url(#g1)"/>
<path d="M60 170 h280 a18 18 0 0 1 18 18 v44 a22 22 0 0 1 -22 22 h-272 a22 22 0 0 1 -22 -22 v-44 a18 18 0 0 1 18 -18z" fill="#0f172a"/>
<rect x="68" y="182" width="124" height="60" rx="26" fill="url(#gog)"/><rect x="208" y="182" width="124" height="60" rx="26" fill="url(#gog)"/>
<path d="M82 196 q40 -12 90 -4" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55" fill="none"/><path d="M222 196 q40 -12 90 -4" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55" fill="none"/>
<ellipse cx="200" cy="292" rx="26" ry="18" fill="#0f172a"/><path d="M160 318 q40 34 80 0" stroke="#0f172a" stroke-width="9" stroke-linecap="round" fill="none"/>
<circle cx="120" cy="300" r="16" fill="#fda4af" opacity=".6"/><circle cx="280" cy="300" r="16" fill="#fda4af" opacity=".6"/>
<path d="M120 360 q80 40 160 0 l10 30 q-90 36 -180 0z" fill="#FF5A5F"/></svg>
<div class="bubble">스키장 가기 전에<br>이것만 챙겨요!</div><div class="logo"><img src="snowpan-wordmark.svg"></div></div>
<!-- B: 눈이 — 작은 설인(예티) -->
<div class="card"><div class="name">B. 눈이</div><div class="sub">작은 설인 · 털북숭이, 겨울 그 자체</div>
<svg viewBox="0 0 400 400"><defs><radialGradient id="g2" cx="40%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dbeafe"/></radialGradient></defs>
<ellipse cx="200" cy="380" rx="120" ry="14" fill="#000" opacity=".25"/>
<path d="M200 50 c90 0 150 70 150 160 c0 60 -30 110 -60 140 l-20 -30 l-25 35 l-25 -35 l-20 35 l-20 -35 l-25 35 l-20 -30 c-30 -30 -60 -80 -60 -140 c0 -90 60 -160 150 -160z" fill="url(#g2)"/>
<ellipse cx="200" cy="225" rx="95" ry="80" fill="#bfdbfe"/>
<circle cx="165" cy="205" r="18" fill="#0f172a"/><circle cx="235" cy="205" r="18" fill="#0f172a"/><circle cx="171" cy="198" r="6" fill="#fff"/><circle cx="241" cy="198" r="6" fill="#fff"/>
<path d="M170 255 q30 30 60 0" stroke="#0f172a" stroke-width="9" stroke-linecap="round" fill="none"/>
<path d="M110 160 q90 -60 180 0" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none"/>
<rect x="120" y="135" width="160" height="34" rx="17" fill="#0f172a"/><rect x="128" y="141" width="60" height="22" rx="11" fill="#38bdf8"/><rect x="212" y="141" width="60" height="22" rx="11" fill="#38bdf8"/>
<circle cx="140" cy="250" r="14" fill="#fda4af" opacity=".7"/><circle cx="260" cy="250" r="14" fill="#fda4af" opacity=".7"/></svg>
<div class="bubble">자외선이 엄청 세요.<br>고글 꼭 챙겨요!</div><div class="logo"><img src="snowpan-wordmark.svg"></div></div>
<!-- C: 판판 — 스키 모양 얼굴 로고형 -->
<div class="card"><div class="name">C. 판판</div><div class="sub">네모 얼굴 · 로고처럼 단순, 어디든 붙임</div>
<svg viewBox="0 0 400 400"><ellipse cx="200" cy="380" rx="120" ry="14" fill="#000" opacity=".25"/>
<rect x="70" y="80" width="260" height="250" rx="60" fill="#fff"/>
<rect x="70" y="80" width="260" height="90" rx="60" fill="#0f172a"/><rect x="70" y="130" width="260" height="40" fill="#0f172a"/>
<rect x="95" y="112" width="90" height="40" rx="20" fill="#38bdf8"/><rect x="215" y="112" width="90" height="40" rx="20" fill="#38bdf8"/>
<circle cx="150" cy="230" r="14" fill="#0f172a"/><circle cx="250" cy="230" r="14" fill="#0f172a"/>
<path d="M160 275 q40 30 80 0" stroke="#0f172a" stroke-width="10" stroke-linecap="round" fill="none"/>
<path d="M60 300 l-20 60 M340 300 l20 60" stroke="#FF5A5F" stroke-width="14" stroke-linecap="round"/></svg>
<div class="bubble">렌탈샵 가격,<br>한눈에 비교해요</div><div class="logo"><img src="snowpan-wordmark.svg"></div></div>
</body></html>
