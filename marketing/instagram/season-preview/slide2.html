<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, sans-serif;
    background: #F8FAFC;
    color: #0F172A;
    position: relative;
  }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 72px 84px 0;
  }
  .brand { display: flex; align-items: baseline; gap: 18px; }
  .brand .logo { font-size: 54px; font-weight: 900; letter-spacing: 6px; }
  .brand .news { font-family: Georgia, serif; font-style: italic; font-size: 44px; color: #0284C7; }
  .issue { font-size: 26px; font-weight: 600; letter-spacing: 3px; color: #64748B; }
  .rule { margin: 36px 84px 0; height: 3px; background: rgba(15,23,42,.25); }
  .content { padding: 88px 84px 0; }
  .chip {
    display: inline-block; background: #0F172A; color: #F8FAFC;
    font-size: 30px; font-weight: 800; letter-spacing: 2px;
    padding: 14px 30px; border-radius: 8px;
  }
  h2 { margin-top: 48px; font-size: 76px; font-weight: 900; letter-spacing: -1px; line-height: 1.25; }
  .lede { margin-top: 24px; font-size: 34px; color: #475569; font-weight: 500; }
  .items { margin-top: 72px; display: flex; flex-direction: column; gap: 56px; }
  .item { display: flex; gap: 36px; align-items: flex-start; }
  .marker { flex: 0 0 64px; height: 64px; margin-top: 8px; position: relative; }
  .marker.circle { background: #16A34A; border-radius: 50%; }
  .marker.square { background: #2563EB; border-radius: 10px; }
  .marker.diamond { background: #0F172A; border-radius: 10px; transform: rotate(45deg) scale(.88); }
  .item h3 { font-size: 46px; font-weight: 800; }
  .item p { margin-top: 14px; font-size: 32px; line-height: 1.5; color: #475569; }
  .caption {
    margin: 76px 84px 0; padding-top: 34px;
    border-top: 3px solid rgba(15,23,42,.15);
    font-size: 30px; font-weight: 600; color: #64748B;
  }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
    background: #0F172A; color: #F8FAFC;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 84px; font-size: 30px; font-weight: 800; letter-spacing: 1px;
  }
  .footer .page { font-weight: 600; color: #94A3B8; }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand"><span class="logo">SNOWPAN</span><span class="news">news</span></div>
    <div class="issue">2026 WINTER PREVIEW</div>
  </div>
  <div class="rule"></div>

  <div class="content">
    <span class="chip">스노우판은 이렇게</span>
    <h2>슬로프 난이도처럼,<br>거래도 단계별로 쉽게</h2>

    <div class="items">
      <div class="item">
        <div class="marker circle"></div>
        <div>
          <h3>장비를 한곳에서</h3>
          <p>스키·스노보드 판매글을 모아 보고 조건을 한눈에 비교합니다.</p>
        </div>
      </div>
      <div class="item">
        <div class="marker square"></div>
        <div>
          <h3>채팅으로 바로 거래</h3>
          <p>복잡한 절차 없이 판매자와 대화로 바로 연결됩니다.</p>
        </div>
      </div>
      <div class="item">
        <div class="marker diamond"></div>
        <div>
          <h3>리뷰와 평점으로 확인</h3>
          <p>거래 후기를 보고 믿을 만한 상대인지 미리 확인합니다.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="caption">초급 슬로프부터 상급까지, 필요한 장비는 전부 스노우판에</div>

  <div class="footer">
    <span>snowpan.kr</span>
    <span class="page">2 / 3</span>
  </div>
</body>
</html>
